name: Prewarm Boris CI Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prewarm-boris.yml

permissions:
  contents: read
  packages: read

jobs:
  prewarm:
    name: Prewarm slot ${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]

    runs-on:
      - self-hosted
      - Linux
      - X64
      - boris-ci

    container:
      image: ghcr.io/seceab/laravel-ci:php85-node24
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: prewarm
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Identify worker and runtime
        run: |
          echo "slot=${{ matrix.slot }}"
          echo "runner=$RUNNER_NAME"
          hostname
          php --version
          composer --version
          node --version
          npm --version

      - name: Hold slot briefly
        run: sleep 20
